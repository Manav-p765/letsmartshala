      // Saved (prerendered) home page on a small screen: switch the hero to its
      // phone arrangement before first paint, as the app will when it starts.
      // Keep the width in step with NARROW in DayArcHero.jsx.
      (function () {
        var stage = document.querySelector('[data-static] .hero__stage');
        if (stage && window.matchMedia('(max-width: 900px)').matches) stage.classList.add('is-narrow');
      })();
    </script>
